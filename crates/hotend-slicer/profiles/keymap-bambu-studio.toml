# Which Bambu Studio profile key carries each of Hotend's print settings (fields of
# `crates/hotend-settings`), and how a value is written into it. Data, not code: the loader
# (`src/keymap.rs`) checks every row against the field's constant hard range, the character
# rules of keys and tokens and the constant deny list `keymap::DENIED`, so editing this table
# cannot open a key that holds G-code, a path or a name, nor a value outside a field's range.
#
# Columns:
# - `field`: the Hotend field; `role`: `process` or `filament` (machine rows are refused; the
#   nozzle inventory has its own path, `[printer.nozzle_inventory]` of system-profiles.toml);
# - `key`: the profile key; `shape`: `scalar`, `per_filament` (a list of one in a filament
#   file) or `per_variant` (one entry per extruder variant, six on the X2D);
# - `form`: how the text is made: `integer`, `decimal2`, `percent`, `flag01`, `enum` (through
#   `tokens`, Hotend's token = the slicer's token), `colour` or `plate` (the plate's
#   `slicer_value` of system-profiles.toml);
# - `op`: `set` writes the text into every entry, `cap` lowers every entry to at most the
#   value and raises none (`zero_is_off`: an entry of 0 means "off", the safest value);
# - `absent`: `refuse` (a key the installed profile lacks is not invented) or `add` (only for
#   the keys a measured run showed absent and working when added, `keymap::ADD_ALLOWED`);
# - `min`, `max`: the field's hard range, checked again here;
# - `verified`: the key was changed in a real test slice and the sliced file stated the
#   asked value (Bambu Studio 02.09.01.70, `measured_on`). `verified_texts` narrows that
#   to the values that were measured. A row or value that is not verified is only used when
#   the asked value equals what the installed profile already holds; then nothing is written.
#   Any other value is refused (`setting_unmeasured`), never written unseen;
# - `plate`: the bed temperature rows hold for this plate only;
# - `enabled = false`: reserved, neither written nor judged (the jerk rows).
#
# Measured: a test slice of a holder was made in the window with exactly
# these keys changed: process `brim_object_gap`,
# `brim_type`, `curr_bed_type`, `enable_prime_tower`, `initial_layer_infill_speed`,
# `initial_layer_speed`, `wall_loops`; filament `additional_cooling_fan_speed`,
# `close_fan_the_first_x_layers`, `first_x_layer_fan_speed`, `textured_plate_temp`,
# `textured_plate_temp_initial_layer` (and the two `optional` fan keys, which the window
# writes beside the auxiliary fan keys). A hand-made gauge project (17 November 2026) set
# `brim_width`, `skirt_loops`, `enable_support` (0) and `filament_colour` on the command line
# and its proof run echoed them.

schema = 1
revision = "2026-11-18.1"
measured_on = "Bambu Studio 02.09.01.70 (Windows window and Linux command line), 17 and 18 November 2026"

[[map]]
field = "setup.plate_type"
role = "process"
key = "curr_bed_type"
shape = "scalar"
form = "plate"
op = "set"
absent = "add"
verified = true

[[map]]
field = "adhesion.brim_kind"
role = "process"
key = "brim_type"
shape = "scalar"
form = "enum"
op = "set"
absent = "add"
verified = true
# `outer_only`: the holder test slice. `no_brim`: measured on 18 November 2026 with the
# Linux command line 02.09.01.70 in Hotend's sandbox (the calm plan on the placed box): the
# file's settings say `no_brim` and no layer has a brim feature
# (tests/real_bambu_studio.rs, the_real_bambu_studio_slices_without_a_brim_when_the_plan_has_none).
verified_texts = ["outer_only", "no_brim"]
tokens = { none = "no_brim", outer = "outer_only", inner = "inner_only", outer_and_inner = "outer_and_inner" }

