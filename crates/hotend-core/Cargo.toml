[package]
name = "hotend-core"
description = "Hotend's core: project store, sandboxed job runner, tool gateway, agent supervisor, LLM egress and secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hotend_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
jsonschema = { version = "0.61.2", default-features = false }
keyring = "4.2.0"
# `lan-status`: the read-only status listener (`hotend_printer::lan::StatusListener`), which
# the core runs for `printer_status_read` / `printer_watch_start`. Never `lan`: that would
# compile the commanding transport (`LanPrinter`, FTPS upload) into the application. Nothing
# in the core sends a command or a file to a printer over the network.
hotend-printer = { path = "../hotend-printer", features = ["lan-status"] }
hotend-settings = { path = "../hotend-settings" }
hotend-sandbox = { path = "../hotend-sandbox" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
uuid = { version = "1.29.3", features = ["v7"] }
zeroize = "1.9.1"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
