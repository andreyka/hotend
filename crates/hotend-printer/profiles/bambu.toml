# --- Refused by name -------------------------------------------------------------------------
#
# Commands that are refused with a reason wherever no row above accepts them. Anything in
# neither list is refused as unknown.
[[family.gcode.deny]]
category = "eeprom"
codes = ["M500", "M501", "M502", "M503", "M504"]
why = "reads or writes the printer's stored settings"

[[family.gcode.deny]]
category = "firmware"
codes = ["M111", "M112", "M997", "M998", "M999"]
why = "firmware update, restart, emergency stop or debug mode"

[[family.gcode.deny]]
category = "configuration"
codes = ["M92", "M201", "M203", "M205", "M206", "M211", "M218", "M301", "M302", "M303", "M304", "M305", "M350", "M351", "M569", "M575", "M665", "M666", "M851", "M906", "M907", "M908", "M909", "M910", "M913", "M914", "M915"]
why = "changes machine configuration (steps, offsets, PID, motor drivers, travel and motion limits, cold extrusion)"

[[family.gcode.deny]]
category = "network"
codes = ["M540", "M550", "M551", "M552", "M553", "M554", "M586", "M587", "M588", "M589"]
why = "changes network settings"

[[family.gcode.deny]]
category = "storage"
codes = ["M20", "M21", "M22", "M23", "M24", "M25", "M26", "M27", "M28", "M29", "M30", "M32", "M33", "M34", "M928"]
why = "reads, writes, deletes or runs files on the printer's storage"

[[family.gcode.deny]]
category = "pins"
codes = ["M42", "M43", "M226", "M260", "M261", "M280"]
why = "drives pins, buses or servos directly"

# ---------------------------------------------------------------------------------------
# Filaments
# ---------------------------------------------------------------------------------------
#
# The highest temperatures a job may command for a filament family. A family matches when
# the material, upper-cased and without spaces, dashes or underscores, equals the family
# or one of its `aliases`. Nothing matches by prefix: "PCTG" is not "PC". A material that
# matches nothing is refused. The aliases are product names, not observed anywhere. The
# temperatures are general FDM practice, not measured on a printer and not vendor limits:
# the spool's own range (reported by the AMS as nozzle_temp_min/max) is the better source
# once a printer is connected.

[[filament]]
family = "PLA"
aliases = ["PLA Basic", "PLA Matte"]
nozzle_max_c = 240.0
bed_max_c = 70.0
chamber_max_c = 45.0
verified = false
source = "general FDM practice"

