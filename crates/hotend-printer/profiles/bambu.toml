# Printer facts the printer layer depends on, as data (IMPLEMENTATION_BRIEF section 7).
#
# One file, versioned: bump `revision` with every change and `schema` when the layout changes.
# Every block of facts carries its own `verified` flag, and `source` says where a value
# comes from. `verified = true` means the fact was observed in real output, and the block
# says which kind:
#   on a printer   captured or measured on a real printer. None so far: a print has gone
#                  through Bambu Connect to an X2D, and no fact was captured or measured
#                  there.
#   in a slice     read from a file written by the real slicer. So far three files, all
#                  sliced on 2026-11-17 by Bambu Studio 02.09.01.70 for the X2D (0.4 mm
#                  nozzles, one PLA filament on the main nozzle):
#                    the first slice      Cool Plate, stock PLA profile, 26 layers
#                    two textured slices  Textured PEI Plate, Generic PLA with Hotend's
#                                         settings, 37 and 344 layers
#                  Facts of this kind are the G-code table, the section markers, the travel
#                  box, the names in `slice_file`, the two plate rows and the numbers of
#                  `[family.gcode.limits]`; each limit says what was seen and what margin
#                  was added. They say what the slicer writes, not what the printer does.
#                  Where a row does not name the textured slices, it was written from the
#                  first slice and the textured slices pass it unchanged.
# Sources:
#   OpenBambuAPI  = https://raw.githubusercontent.com/Doridian/OpenBambuAPI/main/{mqtt,ftp,tls}.md
#                   (facts only: no text or file of it is in this repository. A row that names
#                   ha-bambulab beside it was found in both)
#   ha-bambulab   = https://github.com/greghesp/ha-bambulab (MIT),
#                   pybambu/{models,const,commands,bambu_client}.py
#   X2D FAQ       = https://wiki.bambulab.com/en/x2d/manual/x2d-faq (Bambu Lab)
#   network ports = https://wiki.bambulab.com/en/general/printer-network-ports (Bambu Lab)
#   error codes   = https://wiki.bambulab.com/en/hms/error-code (Bambu Lab)
#   brief         = docs/IMPLEMENTATION_BRIEF.md section 7
#   real slice    = the files described above (never stored in this repository)
#   public report = a statement by users of the printer, named where it is used; the weakest
#                   source here, never confirmed by us
#
# The nozzle ids and reach repeat crates/hotend-slicer/profiles/printers.toml; a test in this
# crate fails when the two files disagree.

schema = 5
revision = "2026-11-25.2"

# ---------------------------------------------------------------------------------------
# Printers
# ---------------------------------------------------------------------------------------

[[printer]]
id = "bambu-x2d"
name = "Bambu Lab X2D"
# The X2D speaks the H2 / P2S protocol generation, not the X1 one.
family = "bambu-h2"

[printer.identity]
# What the printer calls itself in discovery and in `get_version`.
model_codes = ["N6"]
serial_prefixes = ["20P"]
verified = false
source = "public reports: serial prefix 20P (Bambu Lab forum, serial number decoder, topic 205244; bambulab_metrics_exporter pull request 45, from a captured X2D); model code N6 (bambu-printer-mcp issue 36)"

# What a file sliced for this printer says about itself in its config comments
# (`; printer_model = ...`). A file that names another printer is refused. The comment is
# part of the file being checked, so this catches a wrong profile, not a forgery.
[printer.slice_file]
printer_models = ["Bambu Lab X2D"]
# `; printer_settings_id = ...`, which the real slice also writes into
# `Metadata/project_settings.config`. Checked wherever the file states it.
printer_settings_ids = ["Bambu Lab X2D 0.4 nozzle"]
# The nozzle sizes the G-code table was written from. The job must declare one of them
# for every filament, and the file must state the same size (`; nozzle_diameter = ...`,
# one value per slicer extruder). Three rows of the table hold 0.4 as an exact value.
nozzle_diameters_mm = [0.4]
# The entries a sliced archive may hold: the names of the 21 entries of the real slice,
# with `{plate}` for the number of the one plate the job prints and `{n}` for any number.
# Any other name is refused, and so is a second plate: only the G-code of the declared
# plate is read, so no other G-code may travel in the file.
entries = [
  "[Content_Types].xml",
  "_rels/.rels",
  "3D/3dmodel.model",
  "3D/_rels/3dmodel.model.rels",
  "3D/Objects/object_{n}.model",
  "Metadata/plate_{plate}.gcode",
  "Metadata/plate_{plate}.gcode.md5",
  "Metadata/plate_{plate}.json",
  "Metadata/plate_{plate}.png",
  "Metadata/plate_{plate}_small.png",
  "Metadata/plate_no_light_{plate}.png",
  "Metadata/top_{plate}.png",
  "Metadata/pick_{plate}.png",
  "Metadata/project_settings.config",
  "Metadata/model_settings.config",
  "Metadata/_rels/model_settings.config.rels",
  "Metadata/cut_information.xml",
  "Metadata/slice_info.config",
  "Metadata/filament_sequence.json",
]
# The entries the check itself reads and therefore needs: the G-code, its MD5 (32 hex
# digits, compared with the G-code) and the slicer's own account of the plate.
required_entries = [
  "Metadata/plate_{plate}.gcode",
  "Metadata/plate_{plate}.gcode.md5",
  "Metadata/slice_info.config",
]
verified = true
source = "real slice (in a slice)"

# Build plates. The person chooses the plate, the job declares it, and the file must name
# the same one. `id` is Hotend's own id of the plate: the application stores the person's
# choice as this id and records it with the slice; it is the id of the same plate in
# crates/hotend-slicer/profiles/system-profiles.toml (a test there fails when a name
# differs) and the plate type token of the print settings. The file names the plate by
# `name` in `; curr_bed_type = ...` (and in project_settings.config when the archive has
# it) and by `json_name` as `bed_type` in `Metadata/plate_<n>.json` when it has that.
# `bed_max_c` is the highest bed temperature a file for this plate may command, whatever
# the filament allows. `z_trim_mm` is the Z trim the stock start routine sets for the
# plate (`G29.1 Z...`); a file may set that value or 0 and no other, and a plate without
# one takes 0 only.
[[printer.plate]]
id = "cool"
name = "Cool Plate"
json_name = "cool_plate"
# Seen: 35 C (PLA). The ceiling is 10 C above it: the stock PLA profiles of other makes
# differ by a few degrees, and 45 C is well below the 55 C the same file names for the
# hot plates. The margin was chosen here, not measured.
bed_max_c = 45.0
# Seen: 0.022, once, in the start routine of the first slice.
z_trim_mm = 0.022
verified = true
source = "real slice (in a slice): names, 35 C and the trim; the ceiling is a chosen margin"

[[printer.plate]]
id = "textured-pei"
name = "Textured PEI Plate"
json_name = "textured_plate"
# Seen: 65 C in the start routine and for the first layer, 60 C from the second layer
# (Generic PLA with Hotend's settings; the stock profile states 55 C). The ceiling is
# the machine's bed limit, so the filament's limit is the one that binds (70 C for PLA):
# this plate is the one for the hot plastics, and no slice of them was seen.
bed_max_c = 120.0
# Seen: 0.002, once, in the start routine of each textured slice, where the first slice
# has 0.022.
z_trim_mm = 0.002
verified = true
source = "two textured slices (in a slice): names, 65 and 60 C and the trim; the ceiling is the machine's limit, not measured"

# Ids: `device_extruder` is the extruder id the printer reports and accepts;
# `slicer_extruder` is the slicer's 1-based number for the same nozzle. The numbering is
# inverted between the two. Code maps by these numbers only, never by "main", "left" or "right".
[[printer.nozzle]]
role = "main"
drive = "direct"
ids = { device_extruder = 1, slicer_extruder = 1, verified = false }
# The real slice states the same printable area in its config comments, and a printable
# height of 261 mm for this nozzle. The lower figure of the brief is kept.
reach = { x = [0.0, 256.0], y = [0.0, 256.0], z = [0.0, 260.0], verified = false }
# Where the nozzle may be sent without printing. Measured in the real slice (in a slice):
# every coordinate written in the start and end routines lies inside the reach (X 100 to
# 128, Y 0 to 200, Z 0.6 to 82.6) except one, the start of the load line (`G130`) at
# Y -0.2. The purge chute, the wiper and the cutter are reached by firmware routines
# (`G150.x`, `T`, `M620`) that carry no coordinates, so the file says nothing about where
# they are. Moves written relative to a position only the printer knows are limited by
# `[family.gcode.unplaced]`.
travel = { x = [0.0, 256.0], y = [-0.2, 256.0], z = [0.0, 260.0], verified = true }
# The external spool holder that feeds this nozzle, as a tray id. That 254 and 255 are the
# external spools comes from ha-bambulab; which one feeds which nozzle is inferred.
external_tray = { id = 254, verified = false }
source = "real slices (in a slice): numbering (`physical_extruder_map` 1,0), direct drive, area; ha-bambulab models.py (external spools 254/255); brief"

[[printer.nozzle]]
role = "auxiliary"
drive = "bowden"
ids = { device_extruder = 0, slicer_extruder = 2, verified = false }
# 235.5 x 256 x 256 mm, X from 20.5 mm: the real slices state this area and height.
reach = { x = [20.5, 256.0], y = [0.0, 256.0], z = [0.0, 256.0], verified = false }
max_speed = { mm_s = 200.0, verified = false }
external_tray = { id = 255, verified = false }
source = "real slices (in a slice): numbering, bowden, area, height; X2D FAQ (200 mm/s); ha-bambulab models.py (external spools 254/255)"

# No travel box for the auxiliary nozzle: the real slice printed with the main nozzle only,
# so nothing was measured, and every move of the auxiliary nozzle is held to its reach.

# Parts of the bed that pieces and their brims stay off. Print
# preparation lays every plate out round these boxes, in bed coordinates (mm), and the
# engine checks the finished layout again (`keepout`).
#   start_load_line  Measured in the real slice (in a slice): the start routine draws a load
#                    line from X 100, Y -0.2 at Z 0.6, 40 mm long, feeding 12 mm of
#                    filament. Its direction and width are not in the file, so the box
#                    reaches 40 mm to both sides of the start plus 5 mm, and 8 mm deep. The
#                    size of the box is a judgment, not a measurement. The X2D profile itself
#                    states no excluded area (`bed_exclude_area` is empty).
[[printer.keepout]]
id = "start_load_line"
x = [55.0, 145.0]
y = [0.0, 8.0]
reason = "the start routine draws its load line here before every print"
verified = false
source = "real slice (in a slice): start X 100, Y -0.2, 40 mm long; box size a judgment"

# Hard limits of the machine, whatever the filament.
[printer.limits]
nozzle_max_c = 300.0
bed_max_c = 120.0
chamber_max_c = 65.0
verified = false
source = "X2D FAQ (nozzle 300 C, bed 120 C, chamber 65 C)"

# ---------------------------------------------------------------------------------------
# Protocol families
# ---------------------------------------------------------------------------------------

[[family]]
id = "bambu-h2"
name = "Bambu Lab H2 / P2S / X2 generation"

[family.transport]
mqtt_port = 8883
ftps_port = 990
# Hotend offers only TLS 1.2. Users of several models report that their printers complete no
# other version; for the X2D this is disputed and was not measured.
tls = "1.2"
username = "bblp"
access_code_length = 8
report_topic = "device/{serial}/report"
request_topic = "device/{serial}/request"
# The certificate's common name is the printer's serial number.
certificate_names_serial = true
verified = false
source = "OpenBambuAPI mqtt.md, ftp.md (ports, user name, topics; the same in ha-bambulab bambu_client.py), tls.md (the serial in the certificate); network ports (8883, 990); public reports (TLS 1.2: Home Assistant community, thread 489510)"

[family.storage]
# Hotend delivers over FTPS to external storage only: the addresses below are the ones
# documented for a card. The X2D also has built-in storage (X2D FAQ); whether FTPS reaches
# it was not tried, so it is not used.
ftps_reaches = "external"
url_prefix = "ftp:///"
verified = false
source = "OpenBambuAPI mqtt.md (print.project_file: `ftp:///` for a card); the limit to external storage is a choice of Hotend's"

[family.discovery]
port = 2021
service = "urn:bambulab-com:device:3dprinter:1"
verified = false
source = "network ports (SSDP 1990/2021); ha-bambulab manifest.json (service type)"

[family.project_file]
# bed_leveling, flow_cali, vibration_cali and layer_inspect are booleans in both sources.
# Whether this generation takes numbers instead was not tried.
flag_type = "boolean"
# OpenBambuAPI spells this key "bed_levelling"; ha-bambulab sends "bed_leveling".
bed_leveling_key = "bed_leveling"
# `ams_mapping2` (one {ams_id, slot_id} per project filament) is not sent: that this
# generation wants it is a public report (bambu-printer-mcp README, for H2 and P2S) and its
# fields are not documented by a source used here. To check on the first printer.
send_ams_mapping2 = false
verified = false
source = "OpenBambuAPI mqtt.md (print.project_file) and ha-bambulab commands.py, which differ in the spelling above"

[family.ams]
trays_per_unit = 4
# Regular units have ids 0-3. AMS HT units (one tray each) have ids 128-135.
ht_unit_id_base = 128
ht_unit_count = 8
# In the flat `ams_mapping` array a regular tray is unit * 4 + tray. For an AMS HT,
# ha-bambulab models.py records what it has seen in `print.ams_mapping`: "AMS HT units
# follow on from there at 16-23", and, for prints started on the touchscreen,
# unit * 4 + tray. The bare unit id (128-135) is neither.
# `flat_ht` picks what is sent: "slot_16" (what the source observed) or "unit_id".
# Not tried on a printer: a wrong value makes the printer pause instead of starting
# (OpenBambuAPI mqtt.md), and the LAN transport refuses to start from an AMS HT until it is.
flat_ht = "slot_16"
# External spool holders, as tray ids.
external_ids = [254, 255]
# Unit `info` is a hex bitfield; bits 8-11 hold the device extruder id the unit feeds.
# 14 (0xE) means the unit is not bound to one nozzle.
nozzle_shift = 8
nozzle_mask = 15
nozzle_unbound = 14
verified = false
source = "ha-bambulab models.py (AMS_HT_UNIT_BASE, connected_nozzle, tray_exist_bits, external spools 254/255)"

[family.speed_levels]
silent = 1
standard = 2
sport = 3
ludicrous = 4
verified = false
source = "OpenBambuAPI mqtt.md (print.print_speed); the same levels in ha-bambulab const.py"

# Error codes with a meaning Hotend acts on or can explain. `kind` is `print_error` (the
