# Filament and nozzle switching. `M620 S<n>A ... M621 S<n>A` encloses the lines that run
# when an AMS feeds filament n. The printer decides whether they run, so they are held to
# the same rules as the lines between `M622` and `M623` (below), and a tool selection
# inside must name the same filament n.
