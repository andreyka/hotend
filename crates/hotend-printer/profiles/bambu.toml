# --- Lines that run only if the printer says so --------------------------------------------
#
# `M1002 judge_flag <name>` reads a flag of the print job, `M622 J<n>` starts the lines that
# run when the flag has that value and `M623` ends them. The check cannot know the flag, so
# it holds every such line to the same rules as any other, refuses inside them a change of
# positioning mode, a tool selection, a `G92` on X, Y or Z and another such block, and
# treats the position as unknown afterwards if anything inside could have moved the nozzle.

[[family.gcode.command]]
codes = ["M622"]
class = "branch_start"
forms = ["J"]
args = { J = [0, 2] }
what = "starts the lines that run only when the flag read before has the value J"
basis = "inferred"
verified = true

[[family.gcode.command]]
codes = ["M623"]
class = "branch_end"
what = "ends the lines started by M622"
basis = "stated"
verified = true

[[family.gcode.command]]
codes = ["M622.1"]
sections = ["start", "end"]
forms = ["S"]
args = { S = [0, 0] }
moves = true
what = "unknown (stands before a flag is read)"
basis = "unknown"
verified = true

[[family.gcode.command]]
codes = ["M622.1"]
sections = ["body"]
forms = ["S"]
args = { S = [1, 1] }
stays_put = "in the real slice the slicer lays plastic straight after the time-lapse lines this stands in, from the position it had before them"
what = "unknown (stands before the time-lapse flag is read in every layer)"
basis = "unknown"
verified = true

# What the firmware does with the text is not known beyond the routine's own notes, so only
# the four words seen are accepted, each with one value: a number for the screen state and
# the speed level, a flag name for `judge_flag`, and for `set_filament_type` the material
# of a declared filament or UNKNOWN. `set_flag` (which would change a print option) was
# seen only inside comments and is refused.
[[family.gcode.command]]
codes = ["M1002"]
class = "text"
verbs = { gcode_claim_action = "number", set_gcode_claim_speed_level = "number", set_filament_type = "filament_type", judge_flag = "name" }
what = "tells the screen what the printer is doing, names the filament type, or reads a flag of the print job"
basis = "stated"
verified = true

