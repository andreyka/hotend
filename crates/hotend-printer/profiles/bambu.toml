# ---------------------------------------------------------------------------------------
# G-code this family may be sent
# ---------------------------------------------------------------------------------------
#
# A sliced file passes the check only if every command line matches a row of this table:
# the command word, the section of the file it stands in, the exact set of parameter
# letters and a limit for every value. Anything else is refused. The rows record facts measured
# in the real slices named at the top of this file: single command words, their parameter
# letters and values. A row with `verified = true` was seen there with these letters and with
# values inside these limits. No passage and no comment of the vendor's routines is in this
# file. Rows with `verified = false` are standard commands whose whole
# effect the check follows itself (moves, modes, temperatures); they were not seen in this
# form in the real slice.
#
# A row never records a guessed meaning. `basis` says where `what` comes from:
#   standard   the command means the same in common firmware and the check models it
#   stated     the slicer's own routine says what the line is for (the wording here is ours)
#   inferred   worked out from the values or the place in the file; the row says how
#   unknown    nobody here knows; `what` is "unknown" and the values are held to exactly
#              what was seen
#
# Fields of a row:
#   codes      the command words, upper case, with their sub-code ("G150.1"). "T" is the
#              selection of a project filament (`T<n>`, n counted from 0); a full word such
#              as "T65279" is that one tool number.
#   sections   where the row applies: "start" (the machine start routine), "body" (the
#              print) and "end" (the machine end routine). Left out: everywhere.
#   class      what the check does with the line (left out: "opaque"):
#                move, arc_cw, arc_ccw   followed and held to the nozzle's boxes
#                probe         a guarded move whose end is not known
#                home          the named axes (or all) are at a position the check does not know
#                absolute, relative, e_absolute, e_relative   positioning modes
#                set_position  G92; offsets are followed
#                tool          selects a declared filament; service_tool is a tool number
#                              that is not a filament
#                progress      M73; the remaining time is read
#                area          a probing area: X Y is its corner, I J its size
#                line          a purge line: X Y Z is its start, L its length
#                branch_start, branch_end   the lines between run only if a printer flag says so
#                switch_start, switch_end   the lines between switch to the filament named by S
#                              and run only if the printer decides so
#                text          one of the row's `verbs` and one value of the kind it names:
#                              "number" (0 to 999), "name" (letters, digits, _) or
#                              "filament_type" (the material of a declared filament, or UNKNOWN)
#                mask          one base64 word of `mask_chars` characters
#                opaque        nothing is followed; every value must match `args`
#   forms      the sets of parameter letters the row accepts, each written as one word
#              ("" is the command alone). A line matches only if its letters are exactly
#              one of them, in any order.
#   letters    instead of `forms`, for moves: any subset of these letters
#   args       per letter: [low, high], { one_of = [..] }, { up_to = n } (above 0, at most n),
#              "flag" (the letter alone) or one of
#                nozzle_temp, bed_temp, chamber_temp   a temperature that is set: held to the
#                              filament's and the machine's limits and shown to the person
#                nozzle_temp_ref   a value that may be a nozzle temperature: held to the same
#                              limits and shown apart, because the check cannot tell
#                nozzle        a device extruder id of this printer
#                filament_a    a project filament number followed by the letter A
#                service_tool  one of the `service_tool` numbers
#                plate_z_trim  0, or the `z_trim_mm` of the build plate the job declares
#   moves      after this line the nozzle is somewhere the file does not say. A row whose
#              meaning is unknown must have it, or give in `stays_put` the evidence that the
#              nozzle stays where it was.
#   requires   "relative": accepted only in relative positioning
#   config     the line changes limits or stored configuration. It is counted, held to
#              `max_count` per file, and listed in what a person confirms:
#              travel_limits, stored_settings, motion_limits, motor_current, z_offset
#   what, basis, verified   as described above

[family.gcode]
verified = true
source = "real slice (in a slice): Bambu Studio 02.09.01.70, X2D 0.4 mm nozzle, one PLA filament on the main nozzle, Cool Plate, sliced 2026-11-17"

# The marker comments Bambu Studio writes around the machine routines. They are comments in
# the file being checked, so they prove nothing: they only choose which rows apply, and no
# section has a row that the check would not accept from someone who wrote the whole file.
# A section opens only at its place (`open` before the first command, each marker once and
# in order), the start and end routines may not lay plastic along a path, and both are
# limited in length. A file without `open` is body from the first line to the last.
[family.gcode.sections]
open = "EXECUTABLE_BLOCK_START"
start_end = "MACHINE_START_GCODE_END"
end_start = "MACHINE_END_GCODE_START"
close = "EXECUTABLE_BLOCK_END"
# Seen: 278 commands in the start routine and 77 in the end routine.
start_max_commands = 600
end_max_commands = 200
verified = true

# Moves written relative to a position only the printer knows (after homing, after a
# firmware routine). Nothing can check where such a move ends, and the stock start routine
# has switched the printer's own travel limit check off, so they are held to the direction
# and the distances of the stock routine. A lower Z is a smaller gap between the nozzle
# and the bed.
# Seen: five, all in the start routine: a guarded lift of 22 mm with a guarded lowering of
# 12 mm directly after it, Y -16, Z +5 and Z +6. None carries an E word.
# Every range is [furthest in the negative direction, furthest in the positive direction].
#   sections   the sections that may contain such a move
#   plain      what one G0 or G1 may cover. It is not guarded, so it never lowers Z.
#   guarded    what one guarded move (class `probe`) may cover
#   net        where the sum of the moves on an axis must stay, counted from where the
#              printer itself last left that axis (homing, a firmware routine, a tool
#              change, conditional lines). For Z the sum never goes below 0: a guarded
#              move may lower the nozzle only as far as a move lifted it just before.
#   total_mm   the distance all such moves of a file may cover per axis, both directions
#              added up (seen: Y 16, Z 22 + 12 + 5 + 6)
#   max_count  how many such moves a file may have
# Loading refuses a table in which a plain move or the sum of the moves may lower Z.
[family.gcode.unplaced]
sections = ["start"]
plain = { x = [0.0, 0.0], y = [-16.0, 0.0], z = [0.0, 6.0] }
guarded = { x = [0.0, 0.0], y = [0.0, 0.0], z = [-12.0, 22.0] }
net = { x = [0.0, 0.0], y = [-16.0, 0.0], z = [0.0, 22.0] }
total_mm = { x = 0.0, y = 16.0, z = 45.0 }
max_count = 5
verified = true

# What the moves of a file may do, beyond staying inside the nozzle's boxes. Every number
# was measured in the real slice (in a slice); the comment says what was seen and which
# margin was chosen. A file outside them is refused.
[family.gcode.limits]
# The lowest height any move may name. Seen: 0.2 mm, the first layer, which is also the
# lowest height at which the print travels (it does not lift for short travels). No
# margin: nothing in the real slice goes lower, and every height below the first layer
# is a nozzle closer to the plate than the slicer ever puts it.
min_z_mm = 0.2
# Plastic may be laid at most this far above the highest height at which plastic was laid
# before (above the plate, for the first). Seen: 0.2 mm steps, 26 of them. The limit is
# 80 % of the 0.4 mm bore, the tallest layer such a nozzle is given; a taller step is
# plastic laid into the air.
max_layer_step_mm = 0.32
# The highest F a move may carry, mm/min. Seen: 60000 (the print's travels), which is the
# 1000 mm/s the slicer states as the machine's own limit for X and Y. No margin: beyond
# it the value means nothing.
max_feed_mm_min = 60000.0
# Most filament pushed per millimetre of path, mm/mm. Seen: at most 0.0634 (a line of
# 0.15 mm2). The limit is the widest line (0.75 mm, about twice the bore) at the tallest
# layer (0.32 mm) a 0.4 mm nozzle lays: 0.24 mm2 of 1.75 mm filament. That is 1.6 times
# what was seen; a tighter limit would need the width the slicer meant for each line.
max_e_per_mm = 0.1
# Most filament pulled back and not yet pushed forward again, mm. Seen: 3.4 (3.0 in the
# start routine, plus 0.4 at the first travel of the print). Filament may be pushed
# without moving in X or Y only to undo that, never further. The limit leaves room for
# the 0.8 mm the file states as the main nozzle's full retraction instead of the 0.4 seen.
max_retracted_mm = 4.0
# A push in place may exceed what was pulled back by this much, mm, for the rounding of
# the written values. Seen: the slice pulls back in several moves whose five-decimal
# values sum to 0.39999 mm and pushes 0.4 mm, 0.00001 mm more. The limit is a hundred
# times that and still no plastic to speak of (0.002 mm3).
in_place_slack_mm = 0.001
# The lowest nozzle temperature that must be in force when filament is pushed. Seen: 220 C
# at every such move. 170 C is the usual cold-extrusion guard of FDM firmware; whether
# this printer has one is not known.
min_extrude_c = 170.0
# For the weight the file states: the filament's diameter (seen: 1.75) and the range of
# densities a stated weight may imply for the measured length, g/cm3 (seen: 1.26, PLA).
# The range spans the plastics of the `[[filament]]` table, about 1.0 (ABS) to 1.3 (filled).
filament_diameter_mm = 1.75
density_g_cm3 = [0.9, 1.5]
# How far the length the file states for a filament may be from the length the moves
# push: this fraction plus this many millimetres. Seen: 1490 mm stated (two decimals of
# a metre), 1487.37 mm measured, 0.18 % apart. The 10 mm cover the rounding of the stated
# value (5 mm) and the stock routine's own retraction (3 mm).
length_tolerance = 0.02
length_slack_mm = 10.0
# The time the file states must be at least the time the moves take at their commanded
# speeds (seen: 262 s against the stated 710 s), and at most that time times
# `time_max_factor` plus `time_overhead_s`. Seen: the print itself is stated at 1.5 times
# the moves' time (acceleration) and the routines at 309 s (heating, levelling).
time_max_factor = 4.0
time_overhead_s = 1800.0
# Most lines of G-code. Seen: 42,200. A file of the largest size the archive limits allow
# has at most a few million lines of real moves; beyond this the check stops reading.
max_lines = 5000000
verified = true

