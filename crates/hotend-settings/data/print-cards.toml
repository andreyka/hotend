[card.plate.cool]
status = "refused"
source = "refused by the material table; the TPU guide lists it as compatible and the stricter page wins"

[card.plate.high-temp]
status = "ok"
glue = "required"
bed = [35, 35]
bed_mark = "judgment"
bed_raised = [35, 35]
bed_raised_mark = "judgment"
window = [35, 45]
window_mark = "sourced"
source = "window from the material table; glue required (page on plates)"

[card.plate.engineering]
status = "ok"
glue = "required"
bed = [35, 35]
bed_mark = "judgment"
bed_raised = [35, 35]
bed_raised_mark = "judgment"
window = [30, 35]
window_mark = "sourced"
source = "window from the material table; glue (85A and 90A guide)"

# Softer grades are pushed more slowly. 95A has no cap.
# A grade row holds for its hardness and every softer one down to the next row. A harder
# material than every row gets none of it; a material whose id names no hardness gets the
# softest row. `list` are the lines of the list the grade adds.
[[card.grade]]
shore_a = 90
max_flow_cap_mm3_s = 2.5
list = ["tpu.load"]
mark = "judgment"
source = "lower for soft TPU, no number given (vendor TPU guide); loading and unloading by hand are stated for 85A and 90A (vendor 85A and 90A guide)"

