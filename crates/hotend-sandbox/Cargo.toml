[package]
name = "hotend-sandbox"
description = "Confines the child processes Hotend starts: AI-written CAD code, the agent and vendor slicers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hotend_sandbox"
path = "src/lib.rs"

[[bin]]
name = "hotend-sandbox"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"

[dev-dependencies]
tempfile = "3"
